name: Backend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Test & Verify Backend API
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify Secret & Environment Sanitization
        run: |
          if [ -f backend/.env ]; then
            echo "::error::.env file detected in tracking!"
            exit 1
          fi
          echo "Secret sanitization check passed: No .env committed."

      - name: Run Backend Automated Tests with Code Coverage
        working-directory: ./backend
        run: npm test

      - name: Run Root QA Test Suites
        run: node --test tests/*.test.js
