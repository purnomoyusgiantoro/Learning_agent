name: Continuous Integration & Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Full Regression Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Security Audit (npm audit)
        run: |
          cd backend
          npm audit --audit-level=high

      - name: Run Lint & Code Quality Checks
        run: |
          npm run lint

      - name: Run Backend Automated Test Suite with Coverage
        run: |
          npm run test:coverage

      - name: Run Frontend & Full End-to-End Test Suites
        run: |
          npm test

      - name: Build Verification
        run: |
          npm run build
