<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Berhasil Login</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', initialTheme);
        })();
    </script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-focus: rgba(37, 99, 235, 0.25);
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --toggle-bg: #ffffff;
            --toggle-border: #cbd5e1;
            --toggle-hover: #f1f5f9;
            --badge-bg: #dcfce7;
            --badge-text: #15803d;
            --badge-border: transparent;
            --radius-lg: 12px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
            --theme-transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --primary-focus: rgba(59, 130, 246, 0.35);
            --bg-page: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --toggle-bg: #1e293b;
            --toggle-border: #334155;
            --toggle-hover: #334155;
            --badge-bg: rgba(34, 197, 94, 0.15);
            --badge-text: #4ade80;
            --badge-border: rgba(34, 197, 94, 0.3);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 20px;
            transition: var(--theme-transition);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--text-main);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: var(--theme-transition), transform 0.2s ease;
            z-index: 100;
        }

        .theme-toggle:hover {
            background-color: var(--toggle-hover);
            transform: scale(1.08);
        }

        .theme-toggle:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-focus);
        }

        .card {
            background-color: var(--card-bg);
            padding: 36px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            text-align: center;
            transition: var(--theme-transition);
        }

        .badge-success {
            display: inline-block;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--badge-border);
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 16px;
            transition: var(--theme-transition);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .user-email {
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-logout {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .btn-logout:hover {
            background-color: var(--primary-hover);
        }

        .btn-logout:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-focus);
        }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Ganti Tema">🌙</button>

    <main class="card">
        <div class="badge-success">Autentikasi Berhasil</div>
        <h1>Kamu berhasil login!</h1>
        <p>Selamat datang, <span id="userDisplay" class="user-email">Pengguna</span>.</p>
        <a href="index.html" class="btn-logout" id="logoutBtn">Kembali ke Halaman Login</a>
    </main>

    <script>
        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById("themeToggle");
        function updateThemeUI(theme) {
            if (themeToggleBtn) {
                themeToggleBtn.textContent = theme === "dark" ? "☀️" : "🌙";
                themeToggleBtn.setAttribute("aria-label", theme === "dark" ? "Ganti ke mode terang" : "Ganti ke mode gelap");
                themeToggleBtn.setAttribute("title", theme === "dark" ? "Ganti ke Mode Terang" : "Ganti ke Mode Gelap");
            }
        }

        const currentAppliedTheme = document.documentElement.getAttribute("data-theme") || "light";
        updateThemeUI(currentAppliedTheme);

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener("click", () => {
                const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
                const newTheme = currentTheme === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", newTheme);
                localStorage.setItem("theme", newTheme);
                updateThemeUI(newTheme);
            });
        }

        const userEmail = sessionStorage.getItem("userEmail");
        const userName = sessionStorage.getItem("userName");
        if (userName || userEmail) {
            document.getElementById("userDisplay").textContent = userName ? `${userName} (${userEmail})` : userEmail;
        }
        document.getElementById("logoutBtn").addEventListener("click", () => {
            sessionStorage.removeItem("authToken");
            sessionStorage.removeItem("userEmail");
            sessionStorage.removeItem("userName");
            sessionStorage.removeItem("userData");
        });
    </script>
</body>
</html>
