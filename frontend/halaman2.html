<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang Kembali - Dashboard</title>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', initialTheme);
        })();
    </script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --primary-focus: rgba(37, 99, 235, 0.25);
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --profile-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --toggle-bg: #ffffff;
            --toggle-border: #cbd5e1;
            --toggle-hover: #f1f5f9;
            --badge-bg: #dcfce7;
            --badge-text: #15803d;
            --badge-border: #bbf7d0;
            --status-dot: #16a34a;
            --btn-logout-bg: #fee2e2;
            --btn-logout-text: #dc2626;
            --btn-logout-border: #fecaca;
            --btn-logout-hover: #ef4444;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --transition: all 0.2s ease-in-out;
            --theme-transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --primary-light: rgba(59, 130, 246, 0.12);
            --primary-focus: rgba(59, 130, 246, 0.35);
            --bg-page: #0f172a;
            --card-bg: #1e293b;
            --profile-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --toggle-bg: #1e293b;
            --toggle-border: #334155;
            --toggle-hover: #334155;
            --badge-bg: rgba(34, 197, 94, 0.15);
            --badge-text: #4ade80;
            --badge-border: rgba(34, 197, 94, 0.3);
            --status-dot: #4ade80;
            --btn-logout-bg: rgba(239, 68, 68, 0.15);
            --btn-logout-text: #f87171;
            --btn-logout-border: rgba(239, 68, 68, 0.35);
            --btn-logout-hover: #dc2626;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 24px 16px;
            transition: var(--theme-transition);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--text-main);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--theme-transition), transform 0.2s ease;
            z-index: 100;
        }

        .theme-toggle:hover {
            background-color: var(--toggle-hover);
            transform: scale(1.08);
        }

        .theme-toggle:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--primary-focus);
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 36px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            width: 100%;
            text-align: center;
            transition: var(--theme-transition);
        }

        .header-section {
            margin-bottom: 24px;
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border: 1px solid var(--badge-border);
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: var(--radius-full);
            margin-bottom: 16px;
            letter-spacing: 0.02em;
            transition: var(--theme-transition);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--status-dot);
            display: inline-block;
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.25);
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Profile Summary Card */
        .profile-card {
            background-color: var(--profile-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px 20px;
            margin: 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            transition: var(--theme-transition);
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            border: 3px solid var(--card-bg);
            letter-spacing: 0.05em;
            user-select: none;
            transition: transform 0.2s ease;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .profile-info {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            word-break: break-word;
        }

        .user-email {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            word-break: break-all;
        }

        .info-details {
            width: 100%;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            text-align: left;
            font-size: 12px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .info-val {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Warning banner when no session */
        .session-notice {
            display: none;
            background-color: rgba(234, 179, 8, 0.12);
            color: #ca8a04;
            border: 1px solid rgba(234, 179, 8, 0.3);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
            align-items: center;
            gap: 8px;
        }

        [data-theme="dark"] .session-notice {
            color: #facc15;
            background-color: rgba(234, 179, 8, 0.15);
            border-color: rgba(234, 179, 8, 0.35);
        }

        /* Actions */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            background-color: var(--btn-logout-bg);
            color: var(--btn-logout-text);
            border: 1px solid var(--btn-logout-border);
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-logout:hover {
            background-color: var(--btn-logout-hover);
            color: #ffffff;
            border-color: var(--btn-logout-hover);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-logout:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35);
        }

        .btn-logout svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }
            .avatar {
                width: 64px;
                height: 64px;
                font-size: 20px;
            }
            .info-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle" aria-label="Ganti mode tema" title="Ganti Tema">🌙</button>

    <div class="dashboard-container">
        <main class="card">
            <div id="unauthWarning" class="session-notice" role="alert">
                <span>⚠️</span>
                <span>Anda belum login. Silakan kembali ke halaman login.</span>
            </div>

            <div class="header-section">
                <div class="badge-status">
                    <span class="status-dot"></span>
                    <span>Sesi Aktif</span>
                </div>
                <h1>Selamat Datang Kembali!</h1>
                <p class="subtitle">Senang melihat Anda kembali di portal kami.</p>
            </div>

            <!-- Profile Summary Card -->
            <section class="profile-card" aria-label="Ringkasan Profil Pengguna">
                <div id="userAvatar" class="avatar" aria-hidden="true">U</div>
                <div class="profile-info">
                    <div id="userNameDisplay" class="user-name">Pengguna</div>
                    <div id="userEmailDisplay" class="user-email">user@example.com</div>
                    <!-- Hidden element to maintain backwards compatibility with tests using #userDisplay -->
                    <span id="userDisplay" class="user-email" style="display: none;">Pengguna</span>
                </div>

                <div class="info-details">
                    <div class="info-item">
                        <span class="info-label">Status Akun</span>
                        <span class="info-val" style="color: var(--badge-text);">Terverifikasi</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Peran</span>
                        <span class="info-val">Member</span>
                    </div>
                </div>
            </section>

            <!-- Actions -->
            <div class="actions">
                <button type="button" class="btn-logout" id="logoutBtn" aria-label="Keluar dari akun">
                    <svg viewBox="0 0 24 24">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Keluar / Logout</span>
                </button>
            </div>

            <div class="footer-note">
                Sesi Anda tersimpan dengan aman di browser ini.
            </div>
        </main>
    </div>

    <script>
        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById("themeToggle");
        function updateThemeUI(theme) {
            if (themeToggleBtn) {
                themeToggleBtn.textContent = theme === "dark" ? "☀️" : "🌙";
                themeToggleBtn.setAttribute("aria-label", theme === "dark" ? "Ganti ke mode terang" : "Ganti ke mode gelap");
                themeToggleBtn.setAttribute("title", theme === "dark" ? "Ganti ke Mode Terang" : "Ganti ke Mode Gelap");
            }
        }

        const currentAppliedTheme = document.documentElement.getAttribute("data-theme") || "light";
        updateThemeUI(currentAppliedTheme);

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener("click", () => {
                const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
                const newTheme = currentTheme === "dark" ? "light" : "dark";
                document.documentElement.setAttribute("data-theme", newTheme);
                localStorage.setItem("theme", newTheme);
                updateThemeUI(newTheme);
            });
        }

        // Helper to extract clean initials from full name or email
        function getInitials(name, email) {
            if (name && typeof name === "string" && name.trim()) {
                const parts = name.trim().split(/\s+/);
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[1][0]).toUpperCase();
                }
                return parts[0].slice(0, 2).toUpperCase();
            }
            if (email && typeof email === "string" && email.trim()) {
                const usernamePart = email.split("@")[0].replace(/[^a-zA-Z0-9]/g, "");
                if (usernamePart.length >= 2) {
                    return usernamePart.slice(0, 2).toUpperCase();
                } else if (usernamePart.length === 1) {
                    return usernamePart.toUpperCase();
                }
            }
            return "U";
        }

        // User Data and Session Reading
        const userEmail = sessionStorage.getItem("userEmail");
        const userName = sessionStorage.getItem("userName");
        const authToken = sessionStorage.getItem("authToken");

        const unauthWarning = document.getElementById("unauthWarning");
        const avatarEl = document.getElementById("userAvatar");
        const userNameEl = document.getElementById("userNameDisplay");
        const userEmailEl = document.getElementById("userEmailDisplay");
        const userDisplayEl = document.getElementById("userDisplay");

        if (!userEmail && !authToken) {
            if (unauthWarning) {
                unauthWarning.style.display = "flex";
            }
        } else {
            if (unauthWarning) {
                unauthWarning.style.display = "none";
            }
        }

        // Determine friendly display values
        let displayUserName = "Pengguna";
        let displayUserEmail = "Pengguna Tamu";

        if (userName && userName.trim()) {
            displayUserName = userName.trim();
        } else if (userEmail && userEmail.trim()) {
            const namePrefix = userEmail.split("@")[0];
            // Format camel/dot/underscore into clean name if available
            displayUserName = namePrefix.charAt(0).toUpperCase() + namePrefix.slice(1);
        }

        if (userEmail && userEmail.trim()) {
            displayUserEmail = userEmail.trim();
        }

        if (avatarEl) {
            avatarEl.textContent = getInitials(userName, userEmail);
        }
        if (userNameEl) {
            userNameEl.textContent = displayUserName;
        }
        if (userEmailEl) {
            userEmailEl.textContent = displayUserEmail;
        }
        if (userDisplayEl) {
            userDisplayEl.textContent = userName ? `${userName} (${userEmail})` : (userEmail || "Pengguna");
        }

        // Logout Action Handler
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
            logoutBtn.addEventListener("click", () => {
                sessionStorage.removeItem("authToken");
                sessionStorage.removeItem("userEmail");
                sessionStorage.removeItem("userName");
                sessionStorage.removeItem("userData");
                window.location.href = "index.html";
            });
        }
    </script>
</body>
</html>
