<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Berhasil Login</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 12px;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-page);
            color: var(--text-main);
            padding: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 36px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }
        .badge-success {
            display: inline-block;
            background-color: #dcfce7;
            color: #15803d;
            font-size: 13px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .user-email {
            font-weight: 600;
            color: var(--text-main);
        }
        .btn-logout {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .btn-logout:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge-success">Autentikasi Berhasil</div>
        <h1>Kamu berhasil login!</h1>
        <p>Selamat datang, <span id="userDisplay" class="user-email">Pengguna</span>.</p>
        <a href="index.html" class="btn-logout" id="logoutBtn">Kembali ke Halaman Login</a>
    </main>

    <script>
        const userEmail = sessionStorage.getItem("userEmail");
        const userName = sessionStorage.getItem("userName");
        if (userName || userEmail) {
            document.getElementById("userDisplay").textContent = userName ? `${userName} (${userEmail})` : userEmail;
        }
        document.getElementById("logoutBtn").addEventListener("click", () => {
            sessionStorage.removeItem("authToken");
            sessionStorage.removeItem("userEmail");
            sessionStorage.removeItem("userName");
            sessionStorage.removeItem("userData");
        });
    </script>
</body>
</html>
